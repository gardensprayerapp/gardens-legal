<!DOCTYPE html>
<html lang="en">
<head>

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom)) fixed;
    color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 2rem;
  }
  .moon { font-size: 4rem; }
  h1 { margin: .6rem 0 .3rem; }
  p { color: var(--muted); margin-bottom: 1.6rem; }
  a.button {
    display: block; margin: .6rem auto; max-width: 300px; padding: .9rem 1.2rem;
    background: var(--orange); color: #022C3A; font-weight: 700; text-decoration: none;
    border-radius: 10px; border-bottom: 3px solid #CC6D15;
  }
</style>
</head>
<body>
  <main>
    <div class="moon">🌙</div>
    <h1>Gardens</h1>
    <p>An Islamic prayer companion — free, private, on your device.</p>
